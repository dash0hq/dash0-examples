services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: otelcol
    volumes:
      - ./otelcol.yaml:/etc/otelcol-contrib/config.yaml
    restart: unless-stopped
    ports:
      - 4317:4317
    depends_on:
      - data-prepper

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --enable-feature=otlp-deltatocumulative
      # Enable Prometheus to accept OTLP writes directly
      - --web.enable-otlp-receiver
    ports:
      - 9090:9090

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600

  data-prepper:
    image: opensearchproject/data-prepper:2.16.0
    container_name: data-prepper
    restart: unless-stopped
    volumes:
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml
    ports:
      - 21893:21893
    depends_on:
      - opensearch

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.6.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - 5601:5601
    depends_on:
      - opensearch

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 16686:16686

  perses:
    image: persesdev/perses:v0.54.0
    container_name: perses
    ports:
      - 8080:8080
    volumes:
      - ./perses/config.yaml:/etc/perses/config.yaml
      - ./perses/provisioning:/etc/perses/provisioning
      - perses_data:/etc/perses/data
    depends_on:
      - prometheus
      - opensearch
      - jaeger

volumes:
  prometheus_data:
  perses_data:
  opensearch_data:
